ect": "ファンファーレ：自分の手札を1枚選び山札の下に戻す。戻したならこのカードのBPを＋7000する。", "sheet": "数字2"}, {"name": "お菓子の魔女", "number": "2", "bp": 4000, "cost": 2, "tribe": "魔種族", "effect": "このカードは場にある魔種族の上であれば数字に関係なく出せる。", "sheet": "数字2"}, {"name": "バルファルク", "number": "2", "bp": 6000, "cost": 3, "tribe": "龍種族", "effect": "自分の番中にコストを払ってこのカードを見せて場の横に置き自分の番をパスする。次の自分の番、手札からカードを出す代わりにこのカードを数字や効果に関係なく場に出す。", "sheet": "数字2"}, {"name": "アーニャ・フォージャー", "number": "2", "bp": 1000, "cost": 1, "tribe": "英種族", "effect": "ファンファーレ：このカードが場に出たとき自分の山札を見ることができる。", "sheet": "数字2"}, {"name": "錦木千束", "number": "2", "bp": 0, "cost": 3, "tribe": "英種族", "effect": "ファンファーレ：山札から効果のないフォロワーを3枚まで選び相手に見せてから手札に加える。その後山札を切る。", "sheet": "数字2"}, {"name": "ジョーカー", "number": "2", "bp": 4000, "cost": 1, "tribe": "英種族", "effect": "このカードを場に出した時、手札のスペルカードを1枚捨てて山札からスペルカードを1枚手札に加える。", "sheet": "数字2"}, {"name": "リオレウス", "number": "2", "bp": 5000, "cost": 1, "tribe": "龍種族", "effect": "ファンファーレ：自分の山札から数字が4以下の龍種族フォロワーを1枚相手に見せてから手札に加える。その後山札を切る。", "sheet": "数字2"}, {"name": "女媧", "number": "2", "bp": 0, "cost": 2, "tribe": "神種族", "effect": "ファンファーレ：自分の山札を上から3枚見てそのうち1枚を破壊する。残りは手札に加える。相手全員は山札を上から1枚破壊する。", "sheet": "数字2"}, {"name": "エアリス", "number": "2", "bp": 4000, "cost": 2, "tribe": "霊種族", "effect": "ファンファーレ：次の番自分が使うスペルのコストは全て0になる。", "sheet": "数字2"}, {"name": "ミスミニッツ", "number": "2", "bp": 5000, "cost": 2, "tribe": "物種族", "effect": "場が流れるまで全プレイヤーは数字が1〜4のフォロワーしか手札から出せない。", "sheet": "数字2"}, {"name": "野原みさえ", "number": "2", "bp": 2000, "cost": 1, "tribe": "英種族", "effect": "ファンファーレ：場にある1番上のフォロワーの数字が1か7なら場を流す。", "sheet": "数字2"}, {"name": "ムサシ", "number": "2", "bp": 6000, "cost": 2, "tribe": "英種族", "effect": "場の魔種族フォロワーの1枚につきこのカードの数字を＋2する。", "sheet": "数字2"}, {"name": "涼宮ハルヒ", "number": "3", "bp": 2000, "cost": 0, "tribe": "英種族", "effect": "ファンファーレ：全プレイヤーで最も手札が少ないプレイヤーは山札からカードを3枚引く。", "sheet": "数字3"}, {"name": "オールマイト", "number": "3", "bp": 8000, "cost": 2, "tribe": "英種族", "effect": "ファンファーレ：山札からカードを1枚引く。このカードの下にあるフォロワーの数字が3なら場を流す。", "sheet": "数字3"}, {" }, {"name": "しずくちゃん", "number": "5", "bp": 1000, "cost": 0, "tribe": "霊種族", "effect": "場に霊種族フォロワーがあるなら、このカードの数字は7になる。", "sheet": "数字5"}, {"name": "ぐり", "number": "5", "bp": 6000, "cost": 0, "tribe": "霊種族", "effect": "ファンファーレ：手札にある「ぐら」を破壊したなら山札からカードを3枚引く。", "sheet": "数字5"}, {"name": "ガイアデルム", "number": "5", "bp": 9000, "cost": 3, "tribe": "龍種族", "effect": "ファンファーレ：自分の墓地からスペルを全て手札に加える。以降自分の使うスペルは『キュリア』になる効果をプレイヤーに付与する。", "sheet": "数字5"}, {"name": "ちいかわ", "number": "5", "bp": 4000, "cost": 3, "tribe": "霊種族", "effect": "ファンファーレ：自分の手札にあるスペルを5枚破壊したなら、自分の手札にあるカードを5枚破壊し、自分の山札からカードを5枚引く。", "sheet": "数字5"}, {"name": "ソニック", "number": "5", "bp": 1000, "cost": 0, "tribe": "英種族", "effect": "ファンファーレ：山札からカードを1枚引く。この番自分が1番目のプレイヤーならさらに1枚引く。", "sheet": "数字5"}, {"name": "ジインフィノット", "number": "5", "bp": 20000, "cost": 3, "tribe": "神種族", "effect": "前の番自分が手札から場にカードを1枚以上出しているならこのカードを手札から場に出せない。", "sheet": "数字5"}, {"name": "化け鯨", "number": "5", "bp": 3000, "cost": 1, "tribe": "神種族", "effect": "ファンファーレ：自分の山札からカードを1枚引く。次の番相手プレイヤー全員は山札からカードを引けない。全プレイヤーの中で一番手札が多い相手プレイヤーは2ターンになる。", "sheet": "数字5"}, {"name": "チノ", "number": "5", "bp": 2000, "cost": 1, "tribe": "英種族", "effect": "ファンファーレ：山札からカードを1枚引き公開する。公開したカードが英種族フォロワーならさらに1枚山札からカードを引く。次の番自分の手札にある英種族フォロワーのBPはすべて+4000される。", "sheet": "数字5"}, {"name": "ハートの女王", "number": "5", "bp": 5000, "cost": 2, "tribe": "英種族", "effect": "ファンファーレ：このカードを場に出したとき、数字を1つ指定する。すべてのプレイヤーは、指定された数字のカードを手札か山札から2枚選び破壊する。", "sheet": "数字5"}, {"name": "早乙女アルト", "number": "5", "bp": 5000, "cost": 1, "tribe": "物種族", "effect": "ファンファーレ：山札からカードを1枚引く。全プレイヤーは手札のフォロワーを1枚破壊する。1番数字が低いプレイヤーが破壊できなかったプレイヤー全員はそれぞれ自分の手札を自分で2枚選び山札の下に好きな順番で戻す。", "sheet": "数字5"}, {"name": "ミライドン", "number": "5", "bp": 3000, "cost": 3, "tribe": "龍種族", "effect": "ファンファーレ：自分の山札から数字が3のフォロワーを2枚選び相手に見せてから手札に加える。その後山札を切る。", "sheet": "数字5"}, {"name": "雪ミク", "number": "5", "bp": 4000, "cost": 1, "tribe": "物種族", "effect": "このカードの上にはこのカードよりもBPの高いフォロワーしか出せない。", "sheet": "数字5"}, {"name": "テッカマン", "number": "5", "bp": 5000, "cost": 1, "tribe": "物種族", "effect": "ファンファーレ：手札から物種族フォロワーを1枚破壊する。", "sheet": "数字5"}, {"name": "アルル", "number": "5", "bp": 0, "cost": 2, "tribe": "魔種族", "effect": "ファンファーレ：手札に同じ数字の2枚ペアがあるなら、その2枚を手札から破壊する。", "sheet": "数字5"}, {"name": "青眼の白龍", "number": "5", "bp": 10000, "cost": 1, "tribe": "龍種族", "effect": "", "sheet": "数字5"}, {"name": "王元姫", "number": "5", "bp": 6000, "cost": 0, "tribe": "英種族", "effect": "ファンファーレ：このカードで場が流れたなら、自分の手札からカードを2枚破壊できる。", "sheet": "数字5"}, {"name": "成歩堂龍一", "number": "5", "bp": 0, "cost": 3, "tribe": "英種族", "effect": "ファンファーレ：全プレイヤーは手札を全て山札に戻し切る。その後山札からカードを5枚引く。", "sheet": "数字5"}, {"name": "メタルガルルモン", "number": "5", "bp": 5000, "cost": 1, "tribe": "物種族", "effect": "山札から数字が1の物種族フォロワーを1枚このカードの上に出す。", "sheet": "数字5"}, {"name": "キャプテン・アメリカ", "number": "5", "bp": 3000, "cost": 2, "tribe": "英種族", "effect": "ファンファーレ：自分の手札にあるコスト1以下の英種族フォロワーを2枚までこのカードの上に出す。この時数字が低いフォロワーを上に出す。", "sheet": "数字5"}, {"name": "クララ", "number": "5", "bp": 0, "cost": 3, "tribe": "英種族", "effect": "自分の墓地に元の数字が5のフォロワーが3枚あるなら、このカードのコストは0になる。ファンファーレ：自分の手札にある数字が3以下のフォロワーと数字が6以上のフォロワーを1枚破壊できる。", "sheet": "数字5"}, {"name": "イヴェルカーナ", "number": "5", "bp": 7000, "cost": 2, "tribe": "龍種族", "effect": "ファンファーレ：自分の手札にある龍種族フォロワーを1枚破壊する。次の番相手プレイヤーは破壊したフォロワーの数字以上のフォロワーを手札から出せない。", "sheet": "数字5"}, {"name": "ウーゴ君", "number": "5", "bp": 8000, "cost": 2, "tribe": "英種族", "effect": "ファンファーレ：自分の墓地にあるスペル1つと同じ効果を得る。", "sheet": "数字5"}, {"name": "封印されし者の右足", "number": "5", "bp": 1000, "cost": 3, "tribe": "神種族", "effect": "※このカードをデッキに入れるには『封印されしエクゾディア』をデッキに入れなければならない。", "sheet": "数字5"}, {"name": "工藤新一", "number": "5", "bp": 4000, "cost": 0, "tribe": "英種族", "effect": "ファンファーレ：自分の山札を上から3枚見て好きな順番に入れ替える。", "sheet": "数字5"}, {"name": "ドラえもん", "number": "5", "bp": 1000, "cost": 1, "tribe": "物種族", "effect": "ファンファーレ：山札からコスト1以下のスペルを1枚相手に見せてから手札に加える。その後山札を切る。", "sheet": "数字5"}, {"name": "ブルードラゴン", "number": "5", "bp": 2000, "cost": 3, "tribe": "龍種族", "effect": "次の番の終わりまで全プレイヤーは龍種族フォロワー以外のフォロワーを場に出せない。", "sheet": "数字5"}, {"name": "イミル", "number": "5", "bp": 2000, "cost": 1, "tribe": "神種族", "effect": "ファンファーレ：このカード以降に場に出したフォロワーの効果は無効になる。", "sheet": "数字5"}, {"name": "井ノ上たきな", "number": "5", "bp": 2000, "cost": 2, "tribe": "英種族", "effect": "ファンファーレ：手札から効果のないフォロワーを好きなだけ破壊する。", "sheet": "数字5"}, {"name": "ヒサメ", "number": "5", "bp": 2000, "cost": 2, "tribe": "英種族", "effect": "ファンファーレ：このカードを場にだしたときどちらかふたつの効果を得る。1:次に出したフォロワーは効果が出せない。2:全員手札から1枚をデッキに戻して1枚ドローする。", "sheet": "数字5"}, {"name": "バロン・サメディ", "number": "6", "bp": 4000, "cost": 2, "tribe": "神種族", "effect": "ファンファーレ：このカードのBPは自分より下にあるフォロワーの数×2000アップする。", "sheet": "数字6"}, {"name": "ヒソカ", "number": "6", "bp": 0, "cost": 2, "tribe": "英種族", "effect": "このカードは元の数字が7のフォロワーの上にBP関係なく出せる。", "sheet": "数字6"}, {"name": "封印されし者の左足", "number": "6", "bp": 1000, "cost": 3, "tribe": "神種族", "effect": "※このカードをデッキに入れるには「封印されしエクゾディア」をデッキに入れなければならない。", "sheet": "数字6"}, {"name": "キングボンビー", "number": "6", "bp": 4000, "cost": 2, "tribe": "神種族", "effect": "ファンファーレ：墓地に同じ数字のフォロワーが4枚あるプレイヤーは4枚あるカードの中から2枚を各々の手札に戻す。※複数いる場合は全員。", "sheet": "数字6"}, {"name": "ダセット", "number": "6", "bp": 9000, "cost": 3, "tribe": "物種族", "effect": "ファンファーレ：山札からカードを1枚引く。このカードを場に出した番、相手プレイヤーは1のフォロワーを場に出せない。", "sheet": "数字6"}, {"name": "マレフィセント", "number": "6", "bp": 1000, "cost": 3, "tribe": "魔種族", "effect": "ファンファーレ：自分の手札から魔種族フォロワーを2枚破壊する。（1枚は不可。）このカードがカードの効果で破壊された時、山札から「マレフィセントドラゴン」を1枚選び相手に見せてから手札に加える。その後山札を切る。", "sheet": "数字6"}, {"name": "メタナイト", "number": "6", "bp": 3000, "cost": 0, "tribe": "魔種族", "effect": "ファンファーレ：手札に魔種族フォロワーがあるならこのカードの上に乗せる。", "sheet": "数字6"}, {"name": "ルーファウス", "number": "6", "bp": 3000, "cost": 2, "tribe": "魔種族", "effect": "ファンファーレ：相手プレイヤーを1人選び山札を上から3枚公開してそのうち1枚を破壊し、残りのカードは好きな順番で山札の下に戻す。", "sheet": "数字6"}, {"name": "サノス", "number": "6", "bp": 8000, "cost": 3, "tribe": "魔種族", "effect": "ファンファーレ：自分の墓地にスペルが5枚あるなら自分の山札の半分を上から破壊する。（破壊する枚数は切り上げ）", "sheet": "数字6"}, {"name": "でんじゃらすじーさん", "number": "6", "bp": 3000, "cost": 1, "tribe": "英種族", "effect": "このカードは自分がパスしている時、パスを撤回し、本来の自分の番に強制的に手札から場に出すことができる。", "sheet": "数字6"}, {"name": "戦場ヶ原ひたぎ", "number": "6", "bp": 2000, "cost": 1, "tribe": "英種族", "effect": "ファンファーレ：手札が12枚以上あるプレイヤーは手札を全て山札の下に戻して切って、山札からカードを5枚引く。", "sheet": "数字6"}, {"name": "政", "number": "6", "bp": 0, "cost": 1, "tribe": "英種族", "effect": "ファンファーレ：このカードの下に英種族があった時山札からカードを1枚引き、自分の手札を1枚破壊する。このカードのBPは下にある英種族のBP合計となる。", "sheet": "数字6"}, {"name": "星野アイ", "number": "6", "bp": 1000, "cost": 3, "tribe": "英種族", "effect": "ファンファーレ：全プレイヤーは手札にある英種族フォロワーを2枚まで破壊できる。破壊された枚数分自分は山札からカードを引く。", "sheet": "数字6"}, {"name": "影山飛雄", "number": "6", "bp": 1000, "cost": 1, "tribe": "英種族", "effect": "ファンファーレ：次最初に自分が手札から場に出すフォロワーが英種族なら数字を+2して場に出せる。", "sheet": "数字6"}, {"name": "後藤ひとり", "number": "6", "bp": 6000, "cost": 1, "tribe": "英種族", "effect": "ファンファーレ：山札からカードを1枚引く。場にこのカードしかない状態で場が流れたら自分の手札を3枚破壊する。", "sheet": "数字6"}, {"name": "ギラティナ", "number": "6", "bp": 3000, "cost": 3, "tribe": "龍種族", "effect": "ファンファーレ：このカードが場にあるBP1000以下のフォロワーの上に出したなら、場を革命状態にする。", "sheet": "数字6"}, {"name": "悲鳴嶼行冥", "number": "6", "bp": 8000, "cost": 3, "tribe": "英種族", "effect": "ファンファーレ：場の魔種族のフォロワー1枚につき、2枚ドローできる。", "sheet": "数字6"}, {"name": "ネク", "number": "6", "bp": 5000, "cost": 0, "tribe": "魔種族", "effect": "ファンファーレ：全プレイヤーは手札からカードを1枚破壊する。", "sheet": "数字6"}, {"name": "マガイマガド", "number": "6", "bp": 6000, "cost": 1, "tribe": "龍種族", "effect": "ファンファーレ：手札にある龍種族フォロワーを1枚破壊する。", "sheet": "数字6"}, {"name": "ムゲンダイナ", "number": "6", "bp": 1000, "cost": 3, "tribe": "龍種族", "effect": "ファンファーレ：自分の手札にある龍種族フォロワーを4枚まで相手に見せる。見せた枚数分自分の山札にあるコストⅡ以上の龍種族フォロワーを選び破壊する。その後山札を切る。", "sheet": "数字6"}, {"name": "ハデス", "number": "6", "bp": 1000, "cost": 3, "tribe": "神種族", "effect": "ファンファーレ：相手プレイヤーは手札にあるフォロワーを1枚このカードの下に置く。このカードの下にあるフォロワーの合計BPが16000以上なら自分のコストを3回復し、このカードの上にフォロワーを1枚手札から出せる。※乗せる順番はプレイヤーの順番通り。", "sheet": "数字6"}, {"name": "バン", "number": "6", "bp": 4000, "cost": 2, "tribe": "霊種族", "effect": "ファンファーレ：下にあるフォロワーのコストが0なら山札からカードを3枚引く。", "sheet": "数字6"}, {"name": "グエル・ジェターク", "number": "6", "bp": 2000, "cost": 2, "tribe": "英種族", "effect": "ファンファーレ：自分の手札にあるBP4000のフォロワーを好きなだけ破壊する。", "sheet": "数字6"}, {"name": "シェリー＆ブラゴ", "number": "6", "bp": 2000, "cost": 1, "tribe": "英種族", "effect": "ファンファーレ：このカード以降、場が流れるまで革命状態になる。", "sheet": "数字6"}, {"name": "レム", "number": "6", "bp": 4000, "cost": 2, "tribe": "霊種族", "effect": "効果：自分の手札にある霊種族フォロワーを2枚破壊する。※1枚のみの破壊はできない。", "sheet": "数字6"}, {"name": "原初を刻むメル・ゼナ", "number": "6", "bp": 2000, "cost": 3, "tribe": "龍種族", "effect": "ファンファーレ：①自分の山札から龍種族フォロワーを1枚選び相手に見せてから手札に加える。その後山札を切る。②自分の墓地に「キュリア」が5枚あるなら相手プレイヤー全員は手札、山札から7とLのフォロワーをすべて破壊する。", "sheet": "数字6"}, {"name": "戸愚呂弟", "number": "7", "bp": 8000, "cost": 2, "tribe": "霊種族", "effect": "ファンファーレ：自分の山札からカードを1枚引く。自分の手札が3枚以下の時さらに2枚引く。自分の手札が3枚以下のときこのカードのコストを0にする。", "sheet": "数字7"}, {"name": "ジェネシスドラゴン", "number": "7", "bp": 9000, "cost": 2, "tribe": "龍種族", "effect": "自分の山札が0枚ならこのカードのコストは0になる。", "sheet": "数字7"}, {"name": "金木研", "number": "7", "bp": 4000, "cost": 2, "tribe": "魔種族", "effect": "ファンファーレ：このカードを場に出した時自分の下にあるフォロワーのコストと同じ枚数山札からカードを引く。", "sheet": "数字7"}, {"name": "碇ゲンドウ", "number": "7", "bp": 3000, "cost": 2, "tribe": "神種族", "effect": "ファンファーレ：山札からカードを2枚引く。", "sheet": "数字7"}, {"name": "ヴェノム", "number": "7", "bp": 3000, "cost": 3, "tribe": "魔種族", "effect": "ファンファーレ：場にあるカードを全て破壊する。破壊した枚数分自分のコストを回復させる。（最大3）", "sheet": "数字7"}, {"name": "荻原雪歩", "number": "7", "bp": 5000, "cost": 2, "tribe": "英種族", "effect": "ファンファーレ：場、プレイヤーにかかっている効果を全て無効にする。自分の山札を上から1枚破壊する。", "sheet": "数字7"}, {"name": "マレフィセントドラゴン", "number": "7", "bp": 2000, "cost": 3, "tribe": "龍種族", "effect": "このカードは自分の墓地に「マレフィセント」がないなら場に出せない。ファンファーレ：相手プレイヤー全員は手札のカードを1枚残し、他の手札を全て破壊する。", "sheet": "数字7"}, {"name": "ヌシディアブロス", "number": "7", "bp": 4000, "cost": 2, "tribe": "竜種族", "effect": "ファンファーレ：場に出ている数字が三連続である時このカードを出したら場を流すことができる。", "sheet": "数字7"}, {"name": "暁美ほむら", "number": "7", "bp": 2000, "cost": 2, "tribe": "魔種族", "effect": "このカードは番の最初に場に出せない。このカードを出して場が流れた時、のぞむならこのカードを破壊せずに手札に戻してよい。", "sheet": "数字7"}, {"name": "オーマジオウ", "number": "7", "bp": 1000, "cost": 2, "tribe": "物種族", "effect": "ファンファーレ：この番偶数数字のフォロワーを場に出していたプレイヤーは次の番パスされる。", "sheet": "数字7"}, {"name": "ゴジラ", "number": "7", "bp": 3000, "cost": 0, "tribe": "神種族", "effect": "ファンファーレ：手札から数字が5以上でコストIIIのフォロワーを1枚破壊する。", "sheet": "数字7"}, {"name": "底き底より出でる者", "number": "7", "bp": 9000, "cost": 3, "tribe": "魔種族", "effect": "階段3ファンファーレ：自分の手札からフォロワーを2枚破壊する。自分の山札から魔種族フォロワーを3枚破壊する。", "sheet": "数字7"}, {"name": "ザラブ星人", "number": "7", "bp": 0, "cost": 3, "tribe": "魔種族", "effect": "ファンファーレ：このカードの下にあるフォロワーのファンファーレ効果をこのカードの効果として扱う。", "sheet": "数字7"}, {"name": "ラオウ", "number": "7", "bp": 5000, "cost": 1, "tribe": "英種族", "effect": "この番相手プレイヤーがスペルを使っていたなら、このカードのBPは+10000される。", "sheet": "数字7"}, {"name": "イビルジョー", "number": "7", "bp": 7000, "cost": 2, "tribe": "龍種族", "effect": "このカードは場のカードが竜種族であれば、数字、カードを出す順番に関係なく場に出せる。（カードを出す順番は変動しない）", "sheet": "数字7"}, {"name": "ウェスカー", "number": "7", "bp": 7000, "cost": 1, "tribe": "魔種族", "effect": "ファンファーレ：自分の墓地から元数字5以下の魔種族フォロワーを1枚選び手札に加えることができる。", "sheet": "数字7"}, {"name": "ネルギガンテ", "number": "7", "bp": 8000, "cost": 3, "tribe": "龍種族", "effect": "ファンファーレ：場にあるフォロワーを全てそれぞれの手札に戻す。", "sheet": "数字7"}, {"name": "ロクサス", "number": "7", "bp": 13000, "cost": 3, "tribe": "魔種族", "effect": "自分の墓地に「ソラ」があるなら、このカードのコストは0になる。", "sheet": "数字7"}, {"name": "三島かずや", "number": "7", "bp": 6000, "cost": 1, "tribe": "魔種族", "effect": "このカードは英種族フォロワーとしても扱われる。ファンファーレ：この番BPのフォロワーを出したプレイヤーは次の番パスされ、手札を2枚山札の下に戻す。", "sheet": "数字7"}, {"name": "夜神月", "number": "7", "bp": 4000, "cost": 3, "tribe": "魔種族", "effect": "ファンファーレ：フォロワーの名前を1つ宣言する。宣言された名前のフォロワーを全プレイヤーは手札、山札から破壊する。", "sheet": "数字7"}, {"name": "ネイキッド・スネーク", "number": "7", "bp": 4000, "cost": 1, "tribe": "英種族", "effect": "ファンファーレ：全プレイヤーの墓地に7のフォロワーがないなら、相手プレイヤーは手札、山札から元数字が7のフォロワーを2枚破壊する。", "sheet": "数字7"}, {"name": "範馬勇次郎", "number": "7", "bp": 10000, "cost": 3, "tribe": "魔種族", "effect": "ファンファーレ：自分の手札が0枚なら自分の山札を上から10枚見て5枚を手札に加え、5枚を破壊する。", "sheet": "数字7"}, {"name": "ビッグライト", "number": "", "bp": 0, "cost": 1, "tribe": "", "effect": "次に自分が出すフォロワーの数字は+1される。", "sheet": "スペル"}, {"name": "キュリア", "number": "", "bp": 0, "cost": 1, "tribe": "", "effect": "場が流れるまで手札、場にある龍種族フォロワーの数字は+2される。", "sheet": "スペル"}, {"name": "ヴィブラニウム", "number": "", "bp": 0, "cost": 1, "tribe": "", "effect": "チェーン：自分の山札から数字が3以下のフォロワーを1枚選び相手に見せてから手札に加える。その後山札を切る。", "sheet": "スペル"}, {"name": "ドラゴン呼ぶ笛", "number": "", "bp": 0, "cost": 1, "tribe": "", "effect": "このターン龍種族のフォロワーしか場に出せない。", "sheet": "スペル"}, {"name": "鬼人薬", "number": "", "bp": 0, "cost": 0, "tribe": "", "effect": "次の自分が出すフォロワーのBPは+4000される。", "sheet": "スペル"}, {"name": "ハッスルねじ", "number": "", "bp": 0, "cost": 0, "tribe": "", "effect": "この番自分が3回目以降なら自分のコストを2回復させる。", "sheet": "スペル"}, {"name": "油屋", "number": "", "bp": 0, "cost": 1, "tribe": "", "effect": "山札から自分の墓地にない数字のフォロワーを1枚相手に見せてから手札に加える。その後山札を切る。", "sheet": "スペル"}, {"name": "マッドパーティ", "number": "", "bp": 0, "cost": 0, "tribe": "", "effect": "自分の手札にある同じ数字のフォロワーを4枚相手に見せたなら、場を革命状態にする。", "sheet": "スペル"}, {"name": "20世紀博", "number": "", "bp": 0, "cost": 2, "tribe": "", "effect": "チェーン：次の番が終わるまで全プレイヤーの数字が4以上のフォロワーは全て数字が1になる。", "sheet": "スペル"}, {"name": "キーブレード", "number": "", "bp": 0, "cost": 0, "tribe": "", "effect": "チェーン：自分の山札を上から3枚見て好きなカードを1枚手札に加える。次の番相手はスペルが使えない。", "sheet": "スペル"}, {"name": "スーパーキノコ", "number": "", "bp": 0, "cost": 1, "tribe": "", "effect": "チェーン：自分の手札が3枚以上なら、自分の手札を1枚破壊する。", "sheet": "スペル"}, {"name": "アバダケダブラ", "number": "", "bp": 0, "cost": 1, "tribe": "", "effect": "チェーン：場にある1番上のカードを破壊し、持ち主の墓地に置く。※破壊されたカードが持っている効果も発動しなくなる。", "sheet": "スペル"}, {"name": "ジンの金属器", "number": "", "bp": 0, "cost": 2, "tribe": "", "effect": "次に出す英種族フォロワーの数字をプラス2する。もしくはコストを0にする。", "sheet": "スペル"}, {"name": "だるまさんが転んだ", "number": "", "bp": 0, "cost": 0, "tribe": "", "effect": "チェーン：このスペルを発動した後からこのターンの間はコスト0,1,2,3の順番にしかプレイできなくなる（3の次は0）。", "sheet": "スペル"}, {"name": "リビングデッドの呼び声", "number": "", "bp": 0, "cost": 3, "tribe": "", "effect": "チェーン：自分の墓地にあるコスト1以下でL以外のフォロワーを1枚選び強さに関係なく場に出す。", "sheet": "スペル"}, {"name": "満月", "number": "", "bp": 0, "cost": 1, "tribe": "", "effect": "山札から2枚カードを引く。相手は山札から好きなカードを1枚破壊してもよい。", "sheet": "スペル"}, {"name": "絶好調", "number": "", "bp": 0, "cost": 1, "tribe": "", "effect": "チェーン：次の番に自分が山札から引くカードは1枚多くなる。（カードの効果も含む。）", "sheet": "スペル"}, {"name": "アポトキシン4869", "number": "", "bp": 0, "cost": 0, "tribe": "", "effect": "チェーン：次のフォロワーは場に出た後数字が1になる。", "sheet": "スペル"}, {"name": "領域展開", "number": "", "bp": 0, "cost": 1, "tribe": "", "effect": "チェーン：次に置くフォロワーの強さはBPではなくコストで判断する。", "sheet": "スペル"}, {"name": "見張りのワード", "number": "", "bp": 0, "cost": 1, "tribe": "", "effect": "相手の手札を見ることが出来る。", "sheet": "スペル"}, {"name": "影分身", "number": "", "bp": 0, "cost": 1, "tribe": "", "effect": "チェーン：このスペルを発動した時場に出たカードと同じカードが手札にあれば場に出ているカードの下に置くことができる。", "sheet": "スペル"}, {"name": "アルセウスフォン", "number": "", "bp": 0, "cost": 1, "tribe": "", "effect": "山札から霊種族フォロワーを1枚選び手札に加える。", "sheet": "スペル"}, {"name": "セレブロ", "number": "", "bp": 0, "cost": 0, "tribe": "", "effect": "自分の手札にあるフォロワーを1枚相手に見せてから山札に戻す。その後戻したフォロワーの数字と同じ元数字のフォロワーを1枚相手に見せてから手札に加える。その後山札を切る。", "sheet": "スペル"}, {"name": "増殖するG", "number": "", "bp": 0, "cost": 2, "tribe": "", "effect": "チェーン：この番場が流れた後、相手プレイヤー全員が場に出したフォロワーの枚数分山札からカードを引く。", "sheet": "スペル"}, {"name": "築城", "number": "", "bp": 0, "cost": 0, "tribe": "", "effect": "全プレイヤーは手札からフォロワーを1枚ずつ強さに関係なく場のフォロワーの上に乗せる。※場に出すには自分から", "sheet": "スペル"}, {"name": "キラー", "number": "", "bp": 0, "cost": 0, "tribe": "", "effect": "自分の山札を上からカードを1枚見て破壊するか手札に加える。", "sheet": "スペル"}, {"name": "マスターオブマスター", "number": "L", "bp": 2000, "cost": 3, "tribe": "", "effect": "ファンファーレ：次の番以降自分が使えるコストが4になる効果をプレイヤーに付与する。", "sheet": "L"}, {"name": "マキマ", "number": "L", "bp": 8000, "cost": 1, "tribe": "", "effect": "ファンファーレ：山札からカードを2枚引く。次のターン魔種族フォロワーの数字を全て-2し英種族フォロワーの数字を全て+2する。", "sheet": "L"}, {"name": "佐野万次郎", "number": "L", "bp": 7000, "cost": 3, "tribe": "", "effect": "ファンファーレ：場を抗争状態にする。", "sheet": "L"}, {"name": "うちはマダラ", "number": "L", "bp": 4000, "cost": 3, "tribe": "", "effect": "ファンファーレ：このカードを出した番以降革命状態になる。", "sheet": "L"}, {"name": "アルティメットまどか", "number": "L", "bp": 4000, "cost": 3, "tribe": "", "effect": "ファンファーレ：魔種族フォロワーを3枚まで手札から破壊できる。その後山札から破壊した枚数分魔種族フォロワーを手札に加える。その後山札を切る。", "sheet": "L"}, {"name": "ニューワード", "number": "L", "bp": 6000, "cost": 2, "tribe": "", "effect": "ファンファーレ：次の番自分が出すフォロワーの数字は全て+2される。最大は7。", "sheet": "L"}, {"name": "鬼舞辻無惨", "number": "L", "bp": 4000, "cost": 3, "tribe": "", "effect": "ファンファーレ：このカードが場に出たとき、種族を1つ指定し1ターンの間自分のすべてのフォロワー（Lを除く）はその種族になる。ただしフォロワーの効果は変わらない。", "sheet": "L"}, {"name": "カーン", "number": "L", "bp": 5000, "cost": 2, "tribe": "", "effect": "ファンファーレ：次の番から2ターンの間相手プレイヤー全員はスペルを使えない。番の開始時に手札からフォロワーを3枚まで見せる。場が流れるまで見せたカードしか場に出せない。", "sheet": "L"}, {"name": "ダセット 静寂", "number": "L", "bp": 9000, "cost": 3, "tribe": "", "effect": "このカードは物種族フォロワーとしても扱われる。ファンファーレ：山札からカードを2枚引く。次の番相手プレイヤーは数字が7のフォロワーを場に出せない。", "sheet": "L"}, {"name": "セフィロス", "number": "L", "bp": 3000, "cost": 3, "tribe": "", "effect": "ファンファーレ：場にあるフォロワーの枚数まで手札からカードを破壊し、山札からその枚数分引ける。", "sheet": "L"}, {"name": "黒神めだか", "number": "L", "bp": 7000, "cost": 3, "tribe": "", "effect": "ファンファーレ：山札からカードを1枚引く。手札からカードを1枚破壊する。前の番場を流したカード（Lを除く）と同じ効果をこのカードは得る。", "sheet": "L"}, {"name": "お父様", "number": "L", "bp": 5000, "cost": 2, "tribe": "", "effect": "ファンファーレ：数字を1つ宣言する。自分の手札にある宣言した元の数字のフォロワーを好きなだけ破壊する。", "sheet": "L"}]};
let P=[],field=[],turn=0,passes=0,sel=null,starter=0,gameOver=false;
function onCardPlayed(c){
  if(c.name==='兄者' && field.length>1){
    const idx=field.findIndex(x=>x.id===c.id);
    if(idx>0){
      const target=field[idx-1];
      field.splice(idx-1,1);
      P[target.owner??turn].grave.push(target);
      log('兄者：上にカードが出されたため破壊され、墓地へ送られました。');
    }
  }
}
function power(c){return c.number==='L'?8:Number(c.number)}
function playable(c){if(c.sheet==='スペル')return false;if(P[turn].cost<c.cost)return false;if(!field.length)return true;let t=field[field.length-1];return String(c.number)===String(t.number)?c.bp>t.bp:power(c)>power(t)}
function card(c,s){let cl=c.number==='L'?'nl':'n'+c.number;return `<div class="card ${cl} ${s?'sel':''}"><div><small>${c.sheet==='スペル'?'SPELL':c.number==='L'?'L':'FOLLOWER'}</small><div class="num">${c.number}</div><b>${c.name}</b></div><div class="bp">BP ${c.bp} / C ${c.cost}</div><div class="effect">${c.effect}</div></div>`}
function label(c){return `${c.name}（${c.number} / BP${c.bp} / C${c.cost}）`}
function play(){if(gameOver||turn!==0||sel===null)return;let p=P[0],c=p.hand[sel];if(!playable(c)){log('そのカードは出せません。');return}p.hand.splice(sel,1);p.cost-=c.cost;c.owner=turn;field.push(c);passes=0;sel=null;log('あなた：'+label(c));onCardPlayed(c);next()}
function pass(){if(gameOver||turn!==0)return;passes++;sel=null;log('あなたはパス。');if(passes>=2)flow();else next()}
function next(){turn=(turn+1)%3;P[turn].cost=Math.min(3,P[turn].cost+1);render();if(turn!==0)setTimeout(ai,500)}
function ai(){if(gameOver)return;let p=P[turn],a=p.hand.map((c,i)=>({c,i})).filter(x=>playable(x.c));if(a.length){a.sort((a,b)=>power(a.c)-power(b.c)||a.c.bp-b.c.bp);let x=a[0];p.hand.splice(x.i,1);p.cost-=x.c.cost;x.c.owner=turn;field.push(x.c);passes=0;log(p.name+'：'+label(x.c));onCardPlayed(x.c)}else{passes++;log(p.name+'はパス。')}if(passes>=2)flow();else next()}
function flow(){log('2人連続パス → 自動で場が流れました。');P.forEach(p=>{p.grave.push(...field);if(p.deck.length)p.hand.push(p.deck.pop());p.cost=3});field=[];passes=0;turn=starter;sel=null;check();render();if(turn!==0)setTimeout(ai,500)}
function check(){for(let i=0;i<3;i++)if(P[i].hand.length===0&&P[i].deck.length===0){gameOver=true;log('🎉 '+P[i].name+'の勝利！')}}
function render(){document.getElementById('p1').innerHTML=`<b>${P[0].name}</b><br>手札 ${P[0].hand.length}｜デッキ ${P[0].deck.length}｜墓地 ${P[0].grave.length}<br>コスト ${P[0].cost}/3`;document.getElementById('p2').innerHTML=`<b>${P[2].name}</b><br>手札 ${P[2].hand.length}｜デッキ ${P[2].deck.length}｜墓地 ${P[2].grave.length}<br>コスト ${P[2].cost}/3`;document.getElementById('field').innerHTML=field.length?field.map(c=>card(c,false)).join(''):'<span class="muted">場は空です</span>';document.getElementById('fi').textContent=field.length?'最上位：'+label(field[field.length-1]):'場が空です';let h=document.getElementById('hand');h.innerHTML='';P[0].hand.forEach((c,i)=>{let x=document.createElement('div');x.innerHTML=card(c,i===sel);x.firstElementChild.onclick=()=>{sel=i;render()};h.appendChild(x)});document.getElementById('play').disabled=turn!==0||sel===null||gameOver;document.getElementById('pass').disabled=turn!==0||gameOver}
function log(s){let e=document.getElementById('log');e.innerHTML+=`<div>${s}</div>`;e.scrollTop=e.scrollHeight}
document.getElementById('play').onclick=play;document.getElementById('pass').onclick=pass;
document.getElementById('summary').textContent='数字1〜7：各4枚（28枚）＋スペル：5枚＋L：2枚＝35枚';
document.getElementById('decklist').innerHTML=D.starter.map((c,i)=>`<div class="muted">${i+1}. ${label(c)}　${c.tribe||''}</div>`).join('');
init();
</script></body></html>
